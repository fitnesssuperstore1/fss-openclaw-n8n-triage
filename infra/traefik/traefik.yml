## Traefik v3 — static configuration
## Fronts the n8n and OpenClaw subdomains with auto-HTTPS via Let's Encrypt
## HTTP-01 challenge. Runs in host network mode so it can reach n8n on
## 127.0.0.1:8080 and OpenClaw on 127.0.0.1:18789 directly.
## B9: replace example.com (here + in dynamic/routes.yml) with your company
## domain, and set the ACME email below to a company-controlled address.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false           # don't expose the Traefik dashboard

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com   # B9: set to a company-controlled address
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}
