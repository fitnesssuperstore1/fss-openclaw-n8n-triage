## Traefik in host-network mode so it can reach n8n / OpenClaw on 127.0.0.1
## without any port mapping or container-network gymnastics.

services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 3s
      retries: 3
